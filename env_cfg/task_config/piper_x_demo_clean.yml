# Dual independent PiPER-X arms. The third value is the base-center spacing (m).
render_freq: 0
camera_shader: default
episode_num: 50
use_seed: false
save_freq: 10
embodiment: [piper_x_left, piper_x_right, 0.5870514170838435]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1.0
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
ambient_light: [0.60, 0.60, 0.60]
direction_lights: []
point_lights: []
area_lights:
  - position: [0.0, 0.0, 2.60]
    quaternion: [0.0, 1.0, 0.0, 0.0]
    half_width: 1.80
    half_height: 0.80
    color: [4.5, 4.5, 4.5]
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data_new
clear_cache_freq: 5
collect_data: true
eval_video_log: true
camera_shader: rt
